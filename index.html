<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot giải bài tập</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px;background:#f5f7fa}
input,button{width:100%;box-sizing:border-box;font:inherit;padding:10px;margin:6px 0;border:1px solid #bbb;border-radius:8px}
button{background:#1f6feb;color:#fff;border:0}
#out{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;min-height:80px;line-height:1.5}
</style>
</head>
<body>
<h2>Bot giải bài tập</h2>
<input id="u" placeholder="Dán link bài tập vào đây...">
<button id="go">Giải bài</button>
<div id="out">Kết quả sẽ hiện ở đây.</div>
<script>
go.onclick = async () => {
  out.textContent = "Đang đọc link và giải...";
  try {
    const r = await fetch("/.netlify/functions/solve", {
      method: "POST",
      body: JSON.stringify({ url: u.value.trim() })
    });
    out.textContent = (await r.json()).answer;
  } catch (e) {
    out.textContent = "Lỗi: " + e.message;
  }
};
</script>
</body>
</html>
